[Service]
# Activate the game-power frame feed (FrameFeed contract 1.1): the patched
# mangoapp writes a compact rolling frame summary to
# $XDG_RUNTIME_DIR/steamos-intel-handheld/frame-feed.json for the daemon fast
# lane. Reduction-only and off unless this env is set.
Environment=MANGOAPP_FRAME_FEED=1
ExecStart=
ExecStart=/opt/steamos-intel-handheld/bin/mangoapp
