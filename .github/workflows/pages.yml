name: Static Site Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "docs/package-repository.md"
      - "docs/design/specs/2026-06-24-arch-package-repository-design.md"
      - "docs/design/specs/2026-06-25-arch-package-ci-publisher-design.md"
      - "docs/design/plans/2026-06-24-arch-package-repository.md"
      - "docs/design/plans/2026-06-25-arch-package-ci-publisher.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site preview
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          test -f _site/index.html
          test -f _site/rivoreo-steamos/bootstrap.sh

  deploy:
    # Documentation-only deployment. A Pages deployment replaces the whole site,
    # so this must never run once the signed pacman repository is live: it would
    # delete the package database and key out from under anyone who has the
    # repository configured. The guard below makes that impossible rather than
    # merely unlikely - if a repository is published, only the release workflow,
    # which assembles the site and the repository together, may deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to overwrite a published package repository
        env:
          BASE: https://rivoreo.github.io/steamos-intel-handheld/rivoreo-steamos
        run: |
          set -euo pipefail
          published=0
          for path in key/rivoreo.gpg os/x86_64/rivoreo-steamos.db.tar.gz; do
            code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/$path" || echo 000)"
            echo "$path -> $code"
            if [ "$code" = "200" ]; then
              published=1
            fi
          done
          if [ "$published" = "1" ]; then
            echo "::error::A signed package repository is live on Pages. A site-only" \
                 "deployment would remove it. Publish through a stable vX.Y.Z tag instead."
            exit 1
          fi
          echo "No published repository found; a site-only deployment is safe."
      - name: Build site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          test -f _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
